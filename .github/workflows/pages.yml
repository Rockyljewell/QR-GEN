name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w qrgen-sdk
      - name: Package React Native tarball
        run: |
          cd packages/react-native
          npm ci
          mkdir -p /tmp/rn
          npm pack --pack-destination /tmp/rn
      - name: Build website
        run: npm run build -w qrgen-site
      - name: Add React Native tarball to downloads
        run: cp /tmp/rn/qrgen-react-native-*.tgz site/dist/downloads/qrgen-react-native.tgz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
