name: EAN13 ambiguity diagnostic build
on:
  push:
    branches: [codex/ean-word-diagnostic]
permissions:
  contents: read
concurrency:
  group: ean-word-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    env:
      UPSTREAM_COMMIT: b7dcf63aefc7b94fb97ba09e9b1fb213d9399f54
      CPP_COMMIT: 2ecec3f5be0ee803f6e14a5a2c7028c0cfe525b4
      DIAGNOSTIC: diagnostics/ean-word-ambiguity
      OUT: ${{ runner.temp }}/ean-word-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 5.0.4
          actions-cache-folder: .emsdk-cache
      - name: Clone exact release and verify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git init "$RUNNER_TEMP/zxing-wasm"
          git -C "$RUNNER_TEMP/zxing-wasm" remote add origin https://github.com/Sec-ant/zxing-wasm.git
          git -C "$RUNNER_TEMP/zxing-wasm" fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C "$RUNNER_TEMP/zxing-wasm" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/zxing-wasm" submodule update --init --recursive
          test "$(git -C "$RUNNER_TEMP/zxing-wasm" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test "$(git -C "$RUNNER_TEMP/zxing-wasm/zxing-cpp" rev-parse HEAD)" = "$CPP_COMMIT"
          echo "84d85014bcef424e6457caeaa81a78498af2838354f50db41664f4ebac0be5e9  $RUNNER_TEMP/zxing-wasm/zxing-cpp/core/src/oned/ODMultiUPCEANReader.cpp" | sha256sum --check
          echo "f80daf81fe49616e59b250fac96e25a6c5d73ee5e59e6511cec5b98dc2bd7fae  $GITHUB_WORKSPACE/$DIAGNOSTIC/ean13-whole-word-ambiguity.patch" | sha256sum --check
          node --version > "$OUT/node-version.txt"
          emcc --version > "$OUT/emcc-version.txt"
          cmake --version > "$OUT/cmake-version.txt"
          cp "$GITHUB_WORKSPACE/$DIAGNOSTIC/patch-metadata.json" "$OUT/"
      - name: Apply candidate only to isolated submodule
        if: matrix.variant == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          git -C "$RUNNER_TEMP/zxing-wasm/zxing-cpp" apply --check "$GITHUB_WORKSPACE/$DIAGNOSTIC/ean13-whole-word-ambiguity.patch"
          git -C "$RUNNER_TEMP/zxing-wasm/zxing-cpp" apply "$GITHUB_WORKSPACE/$DIAGNOSTIC/ean13-whole-word-ambiguity.patch"
          echo "b9cd713e52c5579fa9366f6b7c89f5012b10b1510a5c81fb01e2145f57cd46ce  $RUNNER_TEMP/zxing-wasm/zxing-cpp/core/src/oned/ODMultiUPCEANReader.cpp" | sha256sum --check
          git -C "$RUNNER_TEMP/zxing-wasm/zxing-cpp" diff --binary > "$OUT/applied.patch"
      - name: Build release configuration and matching wrapper
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.8.2
          cd "$RUNNER_TEMP/zxing-wasm"
          pnpm --version > "$OUT/pnpm-version.txt"
          pnpm install --frozen-lockfile
          # Official Vite config reads all three hashes, so build all targets.
          # Only READER is evaluated; writer/full are build prerequisites.
          pnpm build:wasm
          pnpm exec vite build
          mkdir -p "$OUT/dist"
          cp -R dist/es "$OUT/dist/es"
          cp src/reader/zxing_reader.wasm "$OUT/zxing_reader.wasm"
          cp src/reader/zxing_reader.js "$OUT/matched-emscripten-glue.js"
          cp src/cpp/CMakeLists.txt "$OUT/CMakeLists.txt"
          cp package.json "$OUT/upstream-package.json"
          printf '{"type":"module"}\n' > "$OUT/package.json"
          node "$GITHUB_WORKSPACE/$DIAGNOSTIC/build-smoke.mjs" "$OUT/dist/es/reader/index.js" "$OUT/zxing_reader.wasm" "${{ matrix.variant }}" "$OUT/build-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ean-word-${{ matrix.variant }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 14

