name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Web SDK + website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck SDK
        run: npm run typecheck -w qrgen-sdk
      - name: Unit tests
        run: npm test -w qrgen-sdk
      - name: Build SDK
        run: npm run build -w qrgen-sdk
      - name: CLI smoke test
        run: |
          node packages/sdk/dist/cli.js generate "ci-check" -o /tmp/ci.png
          node packages/sdk/dist/cli.js scan /tmp/ci.png | grep -q "ci-check"
      - name: Build website
        run: npm run build -w qrgen-site
      - name: Type-check website
        run: npx astro check
        working-directory: site
      - name: Check internal links
        run: node site/scripts/check-links.mjs site/dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: site
      - name: End-to-end tests (fake camera)
        run: npm run test:e2e -w qrgen-site

  skills:
    name: Agent Skills + plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-skills.mjs
      - name: skills CLI discovers every skill
        run: |
          npx -y skills@1 add . --list > /tmp/skills.txt 2>&1 || (cat /tmp/skills.txt; exit 1)
          for s in qrgen-sdk qrgen-barcode-generation qrgen-data-parsing qrgen-batch-scanning qrgen-id-scanning qrgen-migration qrgen-testing; do
            grep -q "$s" /tmp/skills.txt || (echo "missing $s"; cat /tmp/skills.txt; exit 1)
          done
        env:
          DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,camera]"
      - run: python -m pytest -q

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test QRGen.Net.sln -c Release

  swift:
    name: Swift (platform-independent parts, Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests, library, Compose and sample builds
        run: ./gradlew :qrgen-core:test :qrgen-android:assembleRelease :qrgen-compose:assembleRelease :sample:assembleDebug -Pqrgen.android=true --no-daemon

  react-native:
    name: React Native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qrgen .
      - name: Smoke test the REST API
        run: |
          docker run -d --name qrgen -p 8080:8080 qrgen
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          curl -sf "http://127.0.0.1:8080/v1/generate?data=docker-ok&symbology=qr&format=png" -o qr.png
          curl -sf -X POST --data-binary @qr.png -H "content-type: image/png" http://127.0.0.1:8080/v1/scan | grep -q docker-ok
