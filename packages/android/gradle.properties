# Coordinates used for Maven publishing. On JitPack (JITPACK=true) the root
# build script switches to com.github.Rockyljewell.QR-GEN and the git tag.
qrgen.group=dev.qrgen
qrgen.version=1.0.0

# Android modules (qrgen-android, qrgen-compose, sample) are included only when
# an Android SDK is found (ANDROID_HOME, ANDROID_SDK_ROOT or sdk.dir in
# local.properties). Override with -Pqrgen.android=true|false.
qrgen.android=auto

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
