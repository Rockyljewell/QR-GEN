name: qrgen_flutter
description: >-
  QRGen for Flutter: barcode, QR and ID scanning with mobile_scanner, plus a
  zero-native-setup WebView scanner. Shared symbology ids, results and errors
  with every QRGen SDK.
version: 0.1.0
homepage: https://rockyljewell.github.io/QR-GEN/
repository: https://github.com/Rockyljewell/QR-GEN/tree/main/packages/flutter
issue_tracker: https://github.com/Rockyljewell/QR-GEN/issues
topics:
  - barcode
  - qrcode
  - scanner
  - camera
  - webview

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ">=5.1.0 <8.0.0"
  webview_flutter: ^4.4.0
  webview_flutter_android: ">=3.12.0 <5.0.0"
  webview_flutter_wkwebview: ^3.9.0

dev_dependencies:
  flutter_lints: ">=3.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  webview_flutter_platform_interface: ^2.6.0
